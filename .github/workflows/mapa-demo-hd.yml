name: Demo mapa HD · calles sintéticas
on:
  workflow_dispatch:
    inputs:
      confirmar_demo:
        description: Renderizar únicamente el mapa sintético de cinco segundos
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: visualgx2-map-demo
  cancel-in-progress: false
jobs:
  render-map:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.confirmar_demo == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar solo el render y el mapa sintético
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            demo-map/render_ruta.py
            demo-map/mapa_demo.geojson
          sparse-checkout-cone-mode: false
      - name: Instalar utilidades del runner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-pil ffmpeg fonts-dejavu-core
      - name: Renderizar y validar MP4 HD sintético
        shell: bash
        run: |
          python3 demo-map/render_ruta.py \
            --datos demo-map/mapa_demo.geojson \
            --salida "$RUNNER_TEMP/mapa-calles-hd.mp4" \
            --alto 1920 --fps 30 --segundos 5
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/mapa-calles-hd.mp4"
          sha256sum "$RUNNER_TEMP/mapa-calles-hd.mp4"
